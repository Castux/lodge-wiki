<h1>Rename <a href="{{.URL}}">{{.ID}}</a></h1>
<div class="level1">
<form method="post" action="/_/move/{{.ID}}" class="lw-form">
  {{if .Error}}<p class="lw-error">{{.Error}}</p>{{end}}
  <label>New name (path) <input name="to" value="{{.To}}" size="60" style="max-width:40em" autofocus required></label>
  <p class="lw-quiet">Use <code>/</code> to move it to another namespace, e.g. <code>foolslanding/story/new-name</code>.
  {{if .Backlinks}}Links in {{.Backlinks}} page{{if ne .Backlinks 1}}s{{end}} will be updated.{{end}} The page keeps its history.</p>
  <button class="lw-button lw-primary">Rename</button> <a href="{{.URL}}" class="lw-button">Cancel</a>
</form>
</div>
