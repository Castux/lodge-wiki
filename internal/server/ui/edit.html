<form method="post" action="/_/edit/{{.ID}}" class="lw-editor" data-preview="/_/preview/{{.ID}}">
  <div class="lw-editor-head">
    <h1>{{if .Exists}}Editing{{else}}Creating{{end}} <a href="{{.URL}}">{{.ID}}</a></h1>
    <div class="lw-editor-tabs" role="tablist">
      <button type="button" data-tab="write" class="lw-tab lw-active">Write</button>
      <button type="button" data-tab="preview" class="lw-tab">Preview</button>
      <button type="button" data-tab="split" class="lw-tab">Side by side</button>
      <a href="/_/static/help.html" target="_blank" class="lw-help">Syntax help</a>
    </div>
  </div>
  {{if .Conflict}}
  <div class="lw-conflict">
    <p><strong>Someone else saved this page while you were editing.</strong> Your text is below; theirs is shown here. Merge what you need, then save again.</p>
    <textarea readonly rows="10">{{.Conflict}}</textarea>
  </div>
  {{end}}
  <div class="lw-editor-panes lw-mode-write">
    <textarea name="text" class="lw-text" spellcheck="true" autofocus>{{.Text}}</textarea>
    <div class="lw-preview dokuwiki"><div class="page"></div></div>
  </div>
  <input type="hidden" name="base" value="{{.Base}}">
  <div class="lw-editor-foot">
    <input name="summary" class="lw-summary" placeholder="Summary of the change (optional)" value="{{.Summary}}" maxlength="200">
    <button type="submit" class="lw-button lw-primary">Save</button>
    <a href="{{.URL}}" class="lw-button">Cancel</a>
    <span class="lw-hint">Saving an empty page deletes it.</span>
  </div>
</form>
