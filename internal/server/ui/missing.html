<h1>{{.ID}}</h1>
{{if .Deleted}}<p>This page was deleted. <a href="/_/history/{{.Path}}">Its history</a> is kept{{if .CanEdit}}: open an old version there to restore it{{end}}.</p>
{{if .CanEdit}}<p><a href="/_/edit/{{.Path}}" class="lw-button">Write a new page here</a></p>{{end}}
{{else}}<p>This page does not exist yet.{{if .CanEdit}} <a href="/_/edit/{{.Path}}" class="lw-button">Create it</a>{{end}}</p>{{end}}
