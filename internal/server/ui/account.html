<h1>Your account</h1>
<div class="level1">
<p><strong>{{.User.Name}}</strong>{{if .User.RealName}} ({{.User.RealName}}){{end}} · {{.Role}}</p>
{{if .Saved}}<p class="lw-note">Password changed. You stay logged in here; other devices are logged out.</p>{{end}}
<form method="post" action="/_/account" class="lw-form">
  <h2>Change your password</h2>
  {{if .Error}}<p class="lw-error">{{.Error}}</p>{{end}}
  <label>Current password <input type="password" name="old" autocomplete="current-password" required></label>
  <label>New password <input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
  <label>New password again <input type="password" name="again" autocomplete="new-password" minlength="8" required></label>
  <button class="lw-button lw-primary">Change password</button>
</form>
</div>
